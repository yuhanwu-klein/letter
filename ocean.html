<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Hand Tracker - Interactive Waves</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- WebGL Water Background -->
    <canvas id="waterCanvas"></canvas>

    <!-- Three.js Whale Particles Canvas -->
    <canvas id="whaleCanvas"></canvas>

    <!-- Ocean Text Overlay -->
    <div class="ocean-text-overlay">
        <div class="text-content">
            <h2 class="ocean-title">Beneath the Waves</h2>
            <p class="ocean-quote">"In the depths, all secrets are kept"</p>
            <p class="ocean-subtitle">Where light dances and time flows eternal</p>
        </div>
    </div>

    <!-- Camera feed - only visible element -->
    <div class="video-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <!-- Hidden UI container -->
    <div class="container">
        <h1>🌊 Ocean Hand Tracker</h1>
        <div class="info">
            <p>Move your hands to create ripples in the water</p>
            <p id="status">Loading camera...</p>
        </div>

        <div class="controls">
            <button id="toggleBtn">Stop Tracking</button>
            <div class="stats">
                <p>Hands detected: <span id="handCount">0</span></p>
                <p>Ripples: <span id="rippleCount">0</span></p>
                <p>FPS: <span id="fps">0</span></p>
            </div>
        </div>

        <div class="landmarks-info">
            <h3>Hand Landmarks</h3>
            <div id="landmarksData"></div>
        </div>
    </div>

    <!-- Three.js library for whale particles -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="water.js"></script>
    <script src="whale.js"></script>
    <script src="app.js"></script>
</body>
</html>
